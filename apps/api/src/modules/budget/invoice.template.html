<!DOCTYPE html>
<html>
<head><title>Invoice {{invoiceNumber}}</title>
<style>
  body { font-family: Arial, sans-serif; padding: 40px; color: #333; }
  h1 { color: #2563eb; }
  table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
  th { background: #f3f4f6; }
  .total-row { font-weight: bold; background: #eff6ff; }
  .footer { margin-top: 40px; padding-top: 20px; border-top: 2px solid #2563eb; }
</style>
</head>
<body>
  <h1>Traveloop Invoice</h1>
  <p><strong>Invoice #:</strong> {{invoiceNumber}}</p>
  <p><strong>Trip:</strong> {{tripTitle}}</p>
  <p><strong>Generated:</strong> {{generatedDate}}</p>
  <p><strong>Status:</strong> {{paymentStatus}}</p>

  <table>
    <thead>
      <tr><th>#</th><th>Description</th><th>Category</th><th>Qty</th><th>Unit Cost</th><th>Amount</th></tr>
    </thead>
    <tbody>
      {{lineItemsHtml}}
    </tbody>
  </table>

  <div class="footer">
    <p>Subtotal: ${{subtotal}}</p>
    <p>Tax ({{taxRate}}%): ${{taxAmount}}</p>
    <p>Discount: ${{discount}}</p>
    <h2>Grand Total: ${{grandTotal}}</h2>
  </div>
</body>
</html>
