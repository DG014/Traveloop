version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: traveloop-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: traveloop
      POSTGRES_USER: traveloop
      POSTGRES_PASSWORD: traveloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U traveloop -d traveloop']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
